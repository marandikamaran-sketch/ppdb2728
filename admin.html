<!doctype html><html><head><meta charset="utf-8"><title>Admin Website SMPIT Sahabat Alam</title>
<style>
body{margin:0;font-family:Arial;background:#f5faf0;color:#214b27}
.header{background:#145c18;color:white;padding:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:20px}
.card{background:white;padding:20px;border-radius:15px;box-shadow:0 5px 20px #ddd}
iframe{width:100%;height:700px;border:1px solid #ddd;border-radius:10px}
input,textarea{width:100%;padding:10px;margin:6px 0}
button{background:#145c18;color:white;padding:10px;border:0;border-radius:8px}
</style></head><body>
<div class="header"><h1>Admin PPDB SMPIT Sahabat Alam</h1><p>Edit melalui admin, tampilan mengikuti website.</p></div>
<div class="grid">
<div class="card">
<h2>Edit Konten Website</h2>
<label>Judul</label><input>
<label>Deskripsi</label><textarea></textarea>
<label>Harga PPDB</label><input>
<label>Syarat</label><textarea></textarea>
<label>Jadwal</label><input>
<label>Early Bird</label><input>
<button>Simpan Perubahan</button>
<h2>Galeri</h2>
<select><option>Program Unggulan</option><option>Kegiatan Sekolah</option><option>Fasilitas Sekolah</option><option>Ekstrakurikuler</option><option>Prestasi Sekolah</option></select>
<input type="file" multiple>
<button>Upload Foto</button>
</div>
<div class="card">
<h2>Preview Website</h2>
<iframe src="index.html"></iframe>
</div>
</div></body></html>
